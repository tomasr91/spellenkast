<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0c1f">
<title>Spellenkast</title>
<style>
/*
VOICE: speelhal na sluitingstijd — nostalgisch, maar strak als een moderne indie-launcher
IDEA: een arcadekast; elk spel is een kast-scherm met CRT-glans, je munt gaat erin bij Speel
PICTURE: grote game-previews met scanlines; pixel-kast in de header
COLOUR and TYPE: diep inktpaars, per spel één neon accent (groen, turquoise, oranje, paars); Pixelify Sans voor titels, Rubik voor tekst
LAYOUT: header → zoek + filters → uitgelicht → recent gespeeld → alle spellen in een afwisselend raster
*/
@font-face{font-family:Pixelify;src:url(fonts/pixelify-sans-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Pixelify;src:url(fonts/pixelify-sans-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
:root{color-scheme:dark;--bg:#0f0c1f;--panel:#19142f;--panel2:#221b3f;--ink:#f2eefc;--mute:#a49cc4;--line:#342b5a;
--green:#3dffa0;--orange:#ff8f3d;--purple:#a77bff;--teal:#2ee8d8;
--px:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px));
--pxs:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
*{box-sizing:border-box;min-width:0}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background-color:var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip;
background-image:radial-gradient(1200px 500px at 85% -10%,rgba(167,123,255,.18),transparent 60%),radial-gradient(900px 400px at -10% 10%,rgba(46,232,216,.08),transparent 60%)}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
h1,h2,h3,.pix{font-family:Pixelify,Rubik,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

/* Header */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:8px}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:52px;height:52px;flex:none}
h1{margin:0;font-size:clamp(30px,7vw,48px);line-height:1;font-weight:700;letter-spacing:.02em;text-shadow:3px 3px 0 var(--orange),6px 6px 0 rgba(167,123,255,.55)}
.slogan{margin:10px 0 0;color:var(--mute);font-size:16px}
.slogan b{color:var(--green);font-weight:600}
.cab{width:clamp(92px,16vw,150px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 0 18px rgba(46,232,216,.25))}
.cab .scr{animation:flick 4s steps(2) infinite}
@keyframes flick{0%,92%{opacity:1}95%{opacity:.75}}

/* Zoek + filters */
.bar{position:sticky;top:0;z-index:5;padding:12px 0 10px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(15,12,31,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);clip-path:var(--pxs);padding:0 14px;min-height:48px}
.search svg{flex:none;opacity:.7}
.search input{flex:1;background:none;border:0;color:var(--ink);font:16px Rubik,sans-serif;min-height:48px;outline:none}
.search input::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border:0;background:var(--panel);clip-path:var(--pxs);color:var(--mute);font:600 14px Rubik,sans-serif;cursor:pointer}
.chip span{opacity:.6;margin-left:4px}
.chip[aria-pressed=true]{background:var(--green);color:#08140e}

/* Secties */
section{margin-top:28px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.03em}
h2 i{font-style:normal;color:var(--mute);font-family:Rubik,sans-serif;font-size:14px;font-weight:400;margin-left:8px;letter-spacing:0}
.link{background:none;border:0;color:var(--mute);font:600 14px Rubik,sans-serif;min-height:44px;padding:0 4px;cursor:pointer}
.link[aria-pressed=true]{color:var(--orange)}

/* Scherm (preview) */
.shot{position:relative;overflow:hidden;background:var(--panel2);aspect-ratio:16/10}
.shot img,.shot svg.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shot::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 40%,transparent 60%,rgba(0,0,0,.45))}
.tag{position:absolute;z-index:1;left:10px;top:10px;font:700 12px Pixelify,sans-serif;letter-spacing:.06em;padding:4px 8px;background:var(--bg);color:var(--a,var(--green));clip-path:var(--pxs)}
.tag.r{left:auto;right:10px;background:var(--orange);color:#1a0d02}

/* Kaarten */
.lift{transition:transform .18s ease,filter .18s ease}
.lift:hover{transform:translateY(-4px);filter:drop-shadow(0 0 14px color-mix(in srgb,var(--a) 45%,transparent))}
.lift:active{transform:translateY(-1px) scale(.99)}
.card{position:relative;cursor:pointer}
.card .in{clip-path:var(--px);background:var(--panel);display:flex;flex-direction:column;height:100%}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.genres{display:flex;flex-wrap:wrap;gap:6px}
.genres b{font:600 12px Rubik,sans-serif;color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent);padding:3px 8px;clip-path:var(--pxs)}
h3{margin:2px 0 0;font-size:24px;line-height:1.1;font-weight:700}
.desc{margin:0;color:var(--mute);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mute);font-size:13px;margin:0;padding:0;list-style:none}
.facts li::before{content:"■ ";color:var(--a);font-size:9px;vertical-align:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:8px}
.host{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.play{position:relative;flex:none;min-height:44px;padding:0 18px 0 14px;border:0;background:var(--a);color:#0b0816;font:700 16px Pixelify,sans-serif;letter-spacing:.06em;cursor:pointer;clip-path:var(--pxs);display:inline-flex;align-items:center;gap:8px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.play svg{width:14px;height:14px}
.play:active,.play.go{box-shadow:inset 0 2px 0 rgba(0,0,0,.3);transform:translateY(2px)}
.coin{position:fixed;z-index:20;width:20px;height:20px;pointer-events:none;image-rendering:pixelated;animation:coin .45s steps(6) forwards}
@keyframes coin{0%{transform:translate(-50%,-50%) translateY(0);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) translateY(-46px);opacity:0}}

/* Uitgelicht */
.feat .in{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);clip-path:var(--px);background:var(--panel)}
.feat .shot{aspect-ratio:auto;min-height:300px}
.feat .bd{padding:24px 24px 24px 26px;gap:10px;justify-content:center}
.feat h3{font-size:clamp(32px,5vw,46px)}
.feat .desc{-webkit-line-clamp:4;font-size:16px;color:#cfc8e6}
.feat .play{min-height:52px;font-size:20px;padding:0 24px 0 18px}
.feat .tag{font-size:13px}

/* Recent */
.recent{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.mini{flex:0 0 min(280px,78vw);scroll-snap-align:start;display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--panel);clip-path:var(--pxs);padding:8px 10px 8px 8px;cursor:pointer}
.mini .shot{aspect-ratio:1;width:76px}
.mini b{display:block;font:700 18px Pixelify,sans-serif;line-height:1.1}
.mini small{color:var(--mute);font-size:13px}
.mini .play{padding:0 12px;min-height:44px}
.empty{color:var(--mute);background:var(--panel);clip-path:var(--pxs);padding:16px;margin:0;font-size:15px}

/* Raster */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:18px}
.card.wide .in{flex-direction:row}
.card.wide .shot{flex:0 0 50%;aspect-ratio:auto;min-height:220px}
.add{border:2px dashed var(--line);background:transparent;color:var(--mute);min-height:240px;cursor:pointer;display:grid;place-items:center;text-align:center;font:600 16px Rubik,sans-serif;padding:16px}
.add:hover{border-color:var(--green);color:var(--ink)}
.add .pix{display:block;font-size:40px;line-height:1;color:var(--green)}
.none{color:var(--mute);grid-column:1/-1}
.del{position:absolute;z-index:3;top:12px;right:12px;width:44px;height:44px;border:0;background:#ff4d6d;color:#fff;font:700 20px Pixelify,sans-serif;clip-path:var(--pxs);cursor:pointer;display:none}
.editing .del{display:block}
.editing .card{animation:wob .3s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.foot{color:var(--mute);font-size:13px;margin:36px 0 0;padding-bottom:calc(32px + env(safe-area-inset-bottom))}

@media (min-width:700px){.card.wide{grid-column:span 2}}
@media (max-width:699px){
  .card.wide .shot{flex-basis:42%;min-height:170px}
  .card.wide .bd{padding:12px}
  .card.wide h3{font-size:20px}
  .card.wide .facts{display:none}
  .card.wide .desc{-webkit-line-clamp:4;font-size:14px}
  .card.wide .host{display:none}
  .card.wide .row{justify-content:flex-end}
}
@media (max-width:640px){
  .feat .in{grid-template-columns:1fr}
  .feat .shot{min-height:0;aspect-ratio:16/10}
  .feat .bd{padding:18px}
  .top{grid-template-columns:minmax(0,1fr) auto}
  .brand svg{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){.lift,.cab .scr{transition:none;animation:none}.editing .card{animation:none}.coin{animation-duration:.01s}}

dialog{border:0;padding:24px;width:min(420px,92vw);background:var(--panel);color:var(--ink);clip-path:var(--px)}
dialog::backdrop{background:rgba(6,4,15,.7)}
dialog h2{margin-bottom:8px}
label{display:block;font-weight:600;margin-top:12px;font-size:15px}
dialog input{width:100%;min-height:48px;font:16px Rubik,sans-serif;padding:8px 12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px}
dialog input:focus{outline:none;border-color:var(--green)}
.err{color:#ff6b86;font-size:14px;min-height:20px;margin:6px 0 0}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border:2px solid var(--line);background:transparent;font:600 15px Rubik,sans-serif;cursor:pointer}
.btn.on{background:var(--green);border-color:var(--green);color:#08140e}
</style>
</head>
<body>
<header class="wrap top">
  <div>
    <div class="brand">
      <svg viewBox="0 0 13 13" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="5" y="1" width="3" height="3" fill="#ff8f3d"/><rect x="6" y="1" width="1" height="1" fill="#ffd2b0"/>
        <rect x="6" y="4" width="1" height="4" fill="#a49cc4"/>
        <rect x="2" y="8" width="9" height="3" fill="#a77bff"/><rect x="1" y="9" width="11" height="2" fill="#7b55d9"/>
        <rect x="3" y="9" width="1" height="1" fill="#3dffa0"/><rect x="9" y="9" width="1" height="1" fill="#2ee8d8"/>
      </svg>
      <h1>SPELLENKAST</h1>
    </div>
    <p class="slogan">Your next game starts here. <b>Insert coin.</b></p>
  </div>
  <svg class="cab" viewBox="0 0 30 40" shape-rendering="crispEdges" aria-hidden="true">
    <rect x="4" y="0" width="22" height="5" fill="#ff8f3d"/><rect x="6" y="1" width="18" height="3" fill="#1a1230"/>
    <rect x="8" y="2" width="2" height="1" fill="#3dffa0"/><rect x="11" y="2" width="2" height="1" fill="#2ee8d8"/><rect x="14" y="2" width="2" height="1" fill="#ff8f3d"/><rect x="17" y="2" width="2" height="1" fill="#a77bff"/><rect x="20" y="2" width="2" height="1" fill="#3dffa0"/>
    <rect x="3" y="5" width="24" height="35" fill="#5b3fb0"/><rect x="3" y="5" width="2" height="35" fill="#7b55d9"/><rect x="25" y="5" width="2" height="35" fill="#43308a"/>
    <rect x="6" y="7" width="18" height="14" fill="#0b0816"/>
    <g class="scr">
      <rect x="7" y="8" width="16" height="12" fill="#10304a"/>
      <rect x="18" y="9" width="3" height="3" fill="#ffd23d"/>
      <rect x="7" y="16" width="16" height="4" fill="#173f2e"/>
      <rect x="9" y="14" width="3" height="2" fill="#3dffa0"/><rect x="10" y="13" width="1" height="1" fill="#3dffa0"/>
      <rect x="15" y="15" width="5" height="1" fill="#2ee8d8"/><rect x="16" y="14" width="3" height="1" fill="#2ee8d8"/>
      <rect x="7" y="9" width="1" height="1" fill="#fff"/><rect x="11" y="10" width="1" height="1" fill="#fff"/><rect x="14" y="8" width="1" height="1" fill="#fff"/>
    </g>
    <rect x="4" y="22" width="22" height="6" fill="#43308a"/>
    <rect x="8" y="23" width="1" height="3" fill="#a49cc4"/><rect x="7" y="22" width="3" height="2" fill="#ff4d6d"/>
    <rect x="15" y="24" width="2" height="2" fill="#3dffa0"/><rect x="18" y="24" width="2" height="2" fill="#2ee8d8"/><rect x="21" y="24" width="2" height="2" fill="#ff8f3d"/>
    <rect x="12" y="31" width="6" height="4" fill="#1a1230"/><rect x="14" y="32" width="2" height="2" fill="#ffd23d"/>
  </svg>
</header>

<div class="bar">
  <div class="wrap">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 0h3v1H2zM1 1h1v1H1zM5 1h1v1H5zM0 2h1v3H0zM6 2h1v3H6zM1 5h1v1H1zM5 5h1v1H5zM2 6h3v1H2zM6 6h1v1H6zM7 7h1v1H7zM8 8h1v1H8z"/></svg>
      <input id="q" type="search" placeholder="Zoek een spel…" autocomplete="off" aria-label="Zoek een spel">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filter op categorie"></div>
  </div>
</div>

<main class="wrap" id="main">
  <section id="featSec" aria-labelledby="featH">
    <div class="sh"><h2 id="featH">Uitgelicht <i id="featSub">vandaag</i></h2></div>
    <div id="feat"></div>
  </section>

  <section id="recSec" aria-labelledby="recH">
    <div class="sh"><h2 id="recH">Verder spelen</h2></div>
    <div id="recent"></div>
  </section>

  <section aria-labelledby="allH">
    <div class="sh"><h2 id="allH">Alle spellen <i id="count"></i></h2><button class="link" id="edit" type="button" aria-pressed="false">Bewerken</button></div>
    <div class="grid" id="grid"></div>
  </section>

  <p class="foot">Previews en beschrijvingen komen van de spelsites zelf. Je lijst en recent gespeeld worden bewaard op dit toestel.</p>
</main>

<dialog id="dlg">
  <form id="form" novalidate>
    <h2>Spel toevoegen</h2>
    <label for="fname">Naam</label>
    <input id="fname" autocomplete="off" placeholder="Bijvoorbeeld Slither">
    <label for="furl">Webadres</label>
    <input id="furl" inputmode="url" autocomplete="off" placeholder="spel.io">
    <p class="err" id="err"></p>
    <div class="btns">
      <button class="btn" type="button" id="cancel">Annuleren</button>
      <button class="btn on" type="submit">Toevoegen</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
