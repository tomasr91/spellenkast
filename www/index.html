<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14172a">
<title>Quickplay</title>
<style>
/*
VOICE: rustig, speels, persoonlijk — een kleine retro gamebibliotheek
IDEA: een plank met spelcartridges; elke tegel is één cartridge met eigen kleur en pixel-icoon
PICTURE: de tegels zelf: groot pixel-icoon, naam eronder
COLOUR and TYPE: rustig nachtblauw; elk spel zijn eigen kleur; Pixelify Sans voor namen en logo
LAYOUT: kleine header, direct het raster; 2 kolommen op telefoon, meer op breder scherm
*/
@font-face{font-family:Pixelify;src:url(fonts/pixelify-sans-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Pixelify;src:url(fonts/pixelify-sans-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
:root{color-scheme:dark;--bg:#14172a;--ink:#eef0fa;--mute:#9aa0c4;--line:#2d3256;--green:#3dffa0}
*{box-sizing:border-box;min-width:0}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;
background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:8px 8px}
.wrap{max-width:980px;margin:0 auto;padding:0 max(5vw,16px)}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(22px + env(safe-area-inset-top)) 0 18px}
.logo{display:flex;align-items:center;gap:10px;margin:0;font:700 24px/1 Pixelify,sans-serif;letter-spacing:.02em}
.logo svg{width:30px;height:30px}
.edit{background:none;border:0;color:var(--mute);font:600 15px Rubik,sans-serif;min-height:44px;padding:0 4px;cursor:pointer}
.edit[aria-pressed=true]{color:var(--green)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,148px),1fr));gap:14px;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
@media(max-width:340px){.grid{grid-template-columns:1fr 1fr;gap:10px}}

.tile{position:relative;aspect-ratio:1;border-radius:14px;background:linear-gradient(160deg,var(--bg2),var(--bg1));color:var(--fg);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px 10px 18px;cursor:pointer;user-select:none;
box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.18),0 8px 16px -10px rgba(0,0,0,.7);
transition:transform .14s ease,filter .14s ease}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.2px) 0 0/6px 6px;
-webkit-mask:linear-gradient(transparent 35%,#000);mask:linear-gradient(transparent 35%,#000)}
.tile svg{width:58%;height:auto;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));position:relative}
.tile b{font:700 18px/1.1 Pixelify,sans-serif;letter-spacing:.03em;text-align:center;overflow-wrap:anywhere;position:relative}
@media(hover:hover){.tile:hover{transform:translateY(-3px);filter:brightness(1.08)}}
.tile:active{transform:translateY(1px) scale(.98);filter:brightness(1.12)}

.add{aspect-ratio:1;border-radius:14px;border:2px dashed var(--line);background:transparent;color:var(--mute);cursor:pointer;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 15px Rubik,sans-serif}
.add span{font:700 36px/1 Pixelify,sans-serif;color:var(--green)}
.add:hover{border-color:var(--green);color:var(--ink)}

.del{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:10px;border:0;background:#ff4d5e;color:#fff;font:700 20px Pixelify,sans-serif;cursor:pointer;display:none}
.editing .del{display:block}
.editing .tile{animation:wob .28s ease-in-out infinite alternate;cursor:default}
@keyframes wob{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}.editing .tile{animation:none}}

dialog{border:0;border-radius:16px;padding:22px;width:min(400px,92vw);background:#1d2140;color:var(--ink)}
dialog::backdrop{background:rgba(6,8,20,.7)}
dialog h2{margin:0 0 6px;font:700 22px Pixelify,sans-serif}
label{display:block;font-weight:600;margin-top:12px;font-size:15px}
input{width:100%;min-height:48px;font:16px Rubik,sans-serif;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px}
input:focus{outline:none;border-color:var(--green)}
.err{color:#ff7a88;font-size:14px;min-height:20px;margin:6px 0 0}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 15px Rubik,sans-serif;cursor:pointer}
.btn.on{background:var(--green);border-color:var(--green);color:#06140d}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo">
      <svg viewBox="0 0 13 13" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="5" y="1" width="3" height="3" fill="#ff4d5e"/><rect x="6" y="1" width="1" height="1" fill="#ffd0d5"/>
        <rect x="6" y="4" width="1" height="4" fill="#9aa0c4"/>
        <rect x="2" y="8" width="9" height="3" fill="#7b4dff"/><rect x="1" y="9" width="11" height="2" fill="#5a35d0"/>
        <rect x="3" y="9" width="1" height="1" fill="#3dffa0"/><rect x="9" y="9" width="1" height="1" fill="#2ee8d8"/>
      </svg>
      Quickplay
    </h1>
    <button class="edit" id="edit" type="button" aria-pressed="false">Bewerken</button>
  </header>
  <main class="grid" id="grid" aria-label="Spellen"></main>
</div>

<dialog id="dlg">
  <form id="form" novalidate>
    <h2>Spel toevoegen</h2>
    <label for="fname">Naam</label>
    <input id="fname" autocomplete="off" placeholder="Bijvoorbeeld Slither">
    <label for="furl">Webadres</label>
    <input id="furl" inputmode="url" autocomplete="off" placeholder="spel.io">
    <p class="err" id="err"></p>
    <div class="btns">
      <button class="btn" type="button" id="cancel">Annuleren</button>
      <button class="btn on" type="submit">Toevoegen</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
