<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe9ff">
<title>Quickplay</title>
<style>
/*
VOICE: licht, vrolijk, verzorgd — een collectie kleine games
IDEA: één familie witte kaarten; elk spel toont zijn eigen preview
PICTURE: de preview-afbeelding van elke site, op de eigen themakleur van het spel
COLOUR and TYPE: zacht lila achtergrond, witte kaarten, groen accent voor bediening; Rubik
LAYOUT: kleine header met logo, daaronder de lijst; volgorde slepen met de puntjes
*/
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
:root{color-scheme:light;--bg:#efe9ff;--card:#ffffff;--well:#f4f1fb;--edge:#ddd4f5;--ink:#211a3d;--mute:#6f6790;--green:#14b86f;--greenbg:#3dffa0}
*{box-sizing:border-box;min-width:0}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 420px at 100% 0,#ffe3ee 0,transparent 60%),radial-gradient(800px 420px at 0 100%,#ddf7ec 0,transparent 60%);background-attachment:fixed;color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:980px;margin:0 auto;padding:0 max(5vw,16px)}
:focus-visible{outline:3px solid #7b4dff;outline-offset:3px}
button,select{font:inherit;color:inherit}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(22px + env(safe-area-inset-top)) 0 18px}
.logo{display:flex;align-items:center;gap:11px;margin:0;font:800 27px/1 Rubik,sans-serif;letter-spacing:-.02em}
.logo svg{width:44px;height:44px;flex:none;transform:rotate(-4deg)}
.logo em{font-style:normal;background:linear-gradient(90deg,#7b4dff,#ff4f97);-webkit-background-clip:text;background-clip:text;color:transparent}
.edit{background:none;border:0;color:var(--mute);font-weight:600;font-size:15px;min-height:44px;padding:0 4px;cursor:pointer}
.edit[aria-pressed=true]{color:var(--green)}


/* Kaarten: één stijl voor alle spellen */
.list{display:grid;gap:12px;padding-bottom:calc(32px + env(safe-area-inset-bottom));grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:8px;box-shadow:0 6px 16px -12px rgba(60,40,120,.45);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .14s ease,border-color .14s ease}
@media(hover:hover){.card:hover{transform:translateY(-2px);border-color:#bfb0ee;box-shadow:0 12px 22px -12px rgba(60,40,120,.5)}}
.card:active{transform:scale(.985)}
.art{position:relative;aspect-ratio:1.6;border-radius:11px;background:var(--pbg);overflow:hidden;display:grid;place-items:center}
.art img{position:absolute;inset:0;width:100%;height:100%;display:block}
.art img.cover{object-fit:cover}
.art img.contain{object-fit:contain;padding:9%}
.art img.icon{position:static;width:38%;height:auto;aspect-ratio:1;object-fit:contain;border-radius:10px}
.art .ini{font:800 34px/1 Rubik,sans-serif;color:#fff;mix-blend-mode:difference;opacity:.8}
.name{display:block;padding:9px 4px 3px;font-weight:600;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grip{display:none}

/* Lijstweergave: volle breedte, illustratie links, naam rechts */
.is-list .list{grid-template-columns:1fr;gap:10px}
.is-list .card{flex-direction:row;align-items:center;gap:16px;padding:8px}
.is-list .art{flex:0 0 136px;width:136px}
.is-list .name{flex:1;padding:0;font-size:19px}

/* Eigen volgorde: sleepgreep */
.manual .grip{display:grid;place-items:center;position:absolute;top:6px;right:6px;z-index:2;width:44px;height:44px;border-radius:10px;color:var(--mute);touch-action:none;cursor:grab;background:rgba(255,255,255,.88);box-shadow:0 2px 6px rgba(40,20,90,.2)}
.is-list.manual .grip{position:static;flex:none;background:transparent;box-shadow:none}
.grip svg{width:18px;height:18px}
.card.dragging{z-index:10;cursor:grabbing;transition:none;border-color:var(--green);box-shadow:0 20px 34px -14px rgba(60,40,120,.6)}
.card.dragging .grip{cursor:grabbing;color:var(--green)}

.add{border:2px dashed #c9bdf0;border-radius:14px;background:transparent;color:var(--mute);cursor:pointer;min-height:84px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:15px;padding:12px}
.add span{font-size:28px;line-height:1;color:var(--green)}
.add:hover{border-color:var(--green);color:var(--ink)}
.del{position:absolute;top:6px;left:6px;z-index:3;width:40px;height:40px;border-radius:10px;border:0;background:#ff4d5e;color:#fff;font-weight:600;font-size:20px;cursor:pointer;display:none}
.editing .del{display:block}
.is-list .editing .del{position:static;flex:none}
.editing .card{cursor:default}
@media(prefers-reduced-motion:reduce){.card{transition:none}}

dialog{border:0;border-radius:16px;padding:22px;width:min(400px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(33,26,61,.45)}
dialog h2{margin:0 0 6px;font-weight:600;font-size:22px}
label{display:block;font-weight:600;margin-top:12px;font-size:15px}
input{width:100%;min-height:48px;font:16px Rubik,sans-serif;padding:8px 12px;border-radius:10px;border:2px solid var(--edge);background:var(--well);color:var(--ink);margin-top:4px}
input:focus{outline:none;border-color:var(--green)}
.err{color:#d6284a;font-size:14px;min-height:20px;margin:6px 0 0}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:2px solid var(--edge);background:transparent;font-weight:600;font-size:15px;cursor:pointer}
.btn.on{background:var(--greenbg);border-color:var(--greenbg);color:#0b2a1c}
</style>
</head>
<body>
<div class="wrap is-list manual" id="app">
  <header>
    <h1 class="logo"><svg viewBox="0 0 44 44" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5cff"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs>
      <rect x="1" y="1" width="42" height="42" rx="13" fill="url(#lg)"/>
      <rect x="1" y="1" width="42" height="42" rx="13" fill="none" stroke="#211a3d" stroke-opacity=".12" stroke-width="2"/>
      <circle cx="20" cy="20" r="10.5" fill="none" stroke="#fff" stroke-width="6.5"/>
      <path d="M31.5 21.5l-7.5 10.5h5.5l-3 9 10-12.5h-5.8l3.3-7z" fill="#ffd23d" stroke="#211a3d" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="34.5" cy="9.5" r="2.2" fill="#3dffa0"/><circle cx="8.5" cy="35" r="1.6" fill="#fff" opacity=".8"/>
    </svg><span>Quick<em>play</em></span></h1>
    <button class="edit" id="edit" type="button" aria-pressed="false">Bewerken</button>
  </header>

  <main class="list" id="grid" aria-label="Spellen"></main>
</div>

<dialog id="dlg">
  <form id="form" novalidate>
    <h2>Spel toevoegen</h2>
    <label for="fname">Naam</label>
    <input id="fname" autocomplete="off" placeholder="Bijvoorbeeld Slither">
    <label for="furl">Webadres</label>
    <input id="furl" inputmode="url" autocomplete="off" placeholder="spel.io">
    <p class="err" id="err"></p>
    <div class="btns">
      <button class="btn" type="button" id="cancel">Annuleren</button>
      <button class="btn on" type="submit">Toevoegen</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
