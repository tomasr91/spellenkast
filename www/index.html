<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6">
<title>Quickplay</title>
<style>
/*
VOICE: warm, rustig, speels — een collectie kleine dagelijkse games
IDEA: één familie witte kaarten; elk spel toont zijn eigen preview
PICTURE: de preview-afbeelding van elke site, op de eigen themakleur van het spel
COLOUR and TYPE: crème, diep paars, goud en mint uit het spiraal-logo; Rubik
LAYOUT: kleine header met logo, daaronder de lijst; volgorde slepen met de puntjes
*/
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
:root{color-scheme:light;--bg:#f5f0e6;--card:#fffdf8;--well:#f1ebdf;--edge:#e6dccb;--ink:#2b1245;--mute:#7a6a8c;--purple:#3b1760;--gold:#e6a92a;--mint:#8ed3b8}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);background-image:radial-gradient(700px 380px at 100% 0,rgba(142,211,184,.18) 0,transparent 60%),radial-gradient(700px 380px at 0 100%,rgba(230,169,42,.12) 0,transparent 60%);background-attachment:fixed;color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:980px;margin:0 auto;padding:0 max(5vw,16px)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button,select{font:inherit;color:inherit}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(22px + env(safe-area-inset-top)) 0 18px}
.logo{display:flex;align-items:center;gap:12px;margin:0;font:600 28px/1 Rubik,sans-serif;letter-spacing:-.01em;color:var(--purple)}
.logo svg{width:46px;height:46px;flex:none}
.edit{background:none;border:0;color:var(--mute);font-weight:600;font-size:15px;min-height:44px;padding:0 4px;cursor:pointer}
.edit[aria-pressed=true]{color:var(--purple)}


/* Kaarten: één stijl voor alle spellen */
.list{display:grid;gap:12px;padding-bottom:calc(96px + env(safe-area-inset-bottom));grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:8px;box-shadow:0 6px 16px -12px rgba(59,23,96,.35);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .14s ease,border-color .14s ease}
@media(hover:hover){.card:hover{transform:translateY(-2px);border-color:var(--mint);box-shadow:0 12px 22px -12px rgba(59,23,96,.4)}}
.card:active{transform:scale(.985)}
.art{position:relative;aspect-ratio:1.6;border-radius:11px;background:var(--pbg);overflow:hidden;display:grid;place-items:center}
.art img{position:absolute;inset:0;width:100%;height:100%;display:block}
.art img.cover{object-fit:cover}
.art img.contain{object-fit:contain;padding:9%}
.art img.icon{position:static;width:38%;height:auto;aspect-ratio:1;object-fit:contain;border-radius:10px}
.art .ini{font:800 34px/1 Rubik,sans-serif;color:#fff;mix-blend-mode:difference;opacity:.8}
.name{display:block;padding:9px 4px 3px;font-weight:600;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grip{display:none}

/* Lijstweergave: volle breedte, illustratie links, naam rechts */
.is-list .list{grid-template-columns:1fr;gap:10px}
.is-list .card{flex-direction:row;align-items:center;gap:14px;padding:8px}
.is-list .art{flex:0 0 92px;width:92px;border-radius:10px}
.is-list .name{padding:0;font-size:18px}

/* Eigen volgorde: sleepgreep */
.manual .grip{display:grid;place-items:center;position:absolute;top:6px;right:6px;z-index:2;width:30px;height:44px;border-radius:10px;color:var(--mute);touch-action:none;cursor:grab;background:rgba(255,255,255,.88);box-shadow:0 2px 6px rgba(59,23,96,.2)}
.is-list.manual .grip{position:static;flex:none;background:transparent;box-shadow:none}
.grip svg{width:11px;height:11px;opacity:.75}
.card.dragging{z-index:10;cursor:grabbing;transition:none;border-color:var(--gold);box-shadow:0 20px 34px -14px rgba(59,23,96,.5)}
.card.dragging .grip{cursor:grabbing;color:var(--gold)}

.add{border:2px dashed #d9ccb6;border-radius:14px;background:transparent;color:var(--mute);cursor:pointer;min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:15px;padding:12px}
.add span{font-size:28px;line-height:1;color:var(--gold)}
.add:hover{border-color:var(--gold);color:var(--ink)}
.del{position:absolute;top:6px;left:6px;z-index:3;width:40px;height:40px;border-radius:10px;border:0;background:#ff4d5e;color:#fff;font-weight:600;font-size:20px;cursor:pointer;display:none}
.editing .del{display:block}
.is-list .editing .del{position:static;flex:none}
.editing .card{cursor:default}
@media(prefers-reduced-motion:reduce){.card{transition:none}}

/* Dagscore + scores op de kaarten (rustig: één regel) */
.daybar{font-size:15px;color:var(--mute);margin:-6px 2px 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daybar .dl{color:var(--ink);font-weight:600;margin-right:4px}
.daybar .win{color:var(--purple);font-weight:600}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.stats{font-size:14px;line-height:1.35;color:var(--mute);font-variant-numeric:tabular-nums}
.stats span{white-space:nowrap}
.stats .win{color:var(--ink);font-weight:600}

/* Tabbladen onderin */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:rgba(255,253,248,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--edge)}
.tabs button{flex:1;max-width:220px;min-height:52px;border:0;border-radius:14px;background:transparent;color:var(--mute);font-weight:600;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs svg{width:22px;height:22px;fill:currentColor}
.tabs button[aria-current=page]{color:var(--purple);background:var(--well)}
.tabs button[aria-current=page] svg{fill:var(--gold)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#who{max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Scores */
.hbtns{display:flex;align-items:center;gap:6px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--purple);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.link{background:none;border:0;color:var(--mute);font-weight:600;font-size:15px;min-height:44px;padding:0 2px;cursor:pointer}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bhead h2{margin:0;font-size:22px;color:var(--purple)}
.daynav{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 16px}
.daynav b{min-width:150px;text-align:center;font-size:17px}
.nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--edge);background:var(--card);font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}
.nav:disabled{opacity:.35;cursor:default}
.gboard{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 6px 16px -12px rgba(59,23,96,.35)}
.gboard h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:10px}
.gboard h3 img{width:44px;height:28px;object-fit:cover;border-radius:6px;background:var(--well)}
.prow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 0;border-top:1px solid var(--edge)}
.prow:first-of-type{border-top:0}
.prow .pn{flex:1 1 0;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ps{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.prow.win .ps{color:var(--gold)}
.prow.win .pn::after{content:" ★";color:var(--gold)}
.prow.me .pn{color:var(--purple)}
.prow details{flex-basis:100%}
.raw{white-space:pre-wrap;font-size:13px;color:var(--mute);background:var(--well);border-radius:8px;padding:8px;margin:6px 0 0;overflow-wrap:anywhere}
.prow summary{cursor:pointer;color:var(--mute);font-size:13px;list-style:none}
.wait{color:var(--mute);font-size:14px;margin:6px 0 0}
.msg{color:var(--mute);background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:14px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 4px;font-size:15px}
.row2{display:flex;gap:8px;margin-top:4px}.row2 input{margin-top:0}.row2 .btn{flex:none}
select,textarea{width:100%;font:16px Rubik,sans-serif;padding:10px 12px;border-radius:10px;border:2px solid var(--edge);background:var(--well);color:var(--ink);margin-top:4px}
select{min-height:48px}
textarea{resize:vertical}
select:focus,textarea:focus{outline:none;border-color:var(--gold)}
#paste{margin-top:8px}
#board .add{width:100%;min-height:64px;margin-bottom:calc(96px + env(safe-area-inset-bottom))}
@media(max-width:400px){.logo{font-size:23px;gap:9px}.logo svg{width:38px;height:38px}.pill{padding:0 12px}.hbtns{gap:2px}}
.toast{position:fixed;left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:10px;background:var(--purple);color:#fff;border-radius:16px;padding:10px 8px 10px 16px;box-shadow:0 14px 30px -10px rgba(43,18,69,.6);max-width:560px;margin:0 auto}
.toast span{flex:1;font-size:15px}
.toast .btn.on{background:var(--gold);border-color:var(--gold);color:#2b1245}
.btn.sm{min-height:40px;padding:0 12px}
.toast .x{width:40px;height:40px;border:0;background:transparent;color:#fff;font-size:22px;cursor:pointer}
dialog{max-height:90vh;overflow:auto}

dialog{border:0;border-radius:16px;padding:22px;width:min(400px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(43,18,69,.4)}
dialog h2{margin:0 0 6px;font-weight:600;font-size:22px}
label{display:block;font-weight:600;margin-top:12px;font-size:15px}
input{width:100%;min-height:48px;font:16px Rubik,sans-serif;padding:8px 12px;border-radius:10px;border:2px solid var(--edge);background:var(--well);color:var(--ink);margin-top:4px}
input:focus{outline:none;border-color:var(--gold)}
.err{color:#d6284a;font-size:14px;min-height:20px;margin:6px 0 0}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:2px solid var(--edge);background:transparent;font-weight:600;font-size:15px;cursor:pointer}
.btn.on{background:var(--purple);border-color:var(--purple);color:#fff}
</style>
</head>

    <button class="edit" id="edit" type="button" aria-pressed="false">Bewerken</button>
    <button class="edit" id="who" type="button" hidden></button>
  </header>

  <div class="daybar" id="daybar" hidden></div>
  <main class="list" id="grid" aria-label="Spellen"></main>

  <section id="board" hidden aria-labelledby="boardH">
    <h2 id="boardH" class="vh">Scores</h2>
    <div class="daynav">
      <button class="nav" id="prevDay" type="button" aria-label="Vorige dag">‹</button>
      <b id="dayLabel">Vandaag</b>
      <button class="nav" id="nextDay" type="button" aria-label="Volgende dag">›</button>
    </div>
    <div id="boardList"></div>
    <button class="add" id="addScore" type="button"><span>+</span>Score toevoegen</button>
  </section>
</div>

<nav class="tabs" aria-label="Tabbladen">
  <button type="button" data-tab="games" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="2"/><rect x="3" y="10.5" width="18" height="5" rx="2"/><rect x="3" y="17" width="18" height="4" rx="2"/></svg>Spellen</button>
  <button type="button" data-tab="scores"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="5" height="10" rx="1.5"/><rect x="9.5" y="5" width="5" height="16" rx="1.5"/><rect x="16" y="14" width="5" height="7" rx="1.5"/></svg>Scores</button>
</nav>

<div class="toast" id="toast" hidden>
  <span id="toastText"></span>
  <button class="btn on sm" id="toastGo" type="button">Score toevoegen</button>
  <button class="x" id="toastX" type="button" aria-label="Sluiten">×</button>
</div>

<dialog id="setup">
  <form id="setupForm" novalidate>
    <h2>Scores met vrienden</h2>
    <p class="sub">Kies je naam en een groepscode. Je vriend vult dezelfde code in.</p>
    <label for="pname">Jouw naam</label>
    <input id="pname" maxlength="40" autocomplete="off" placeholder="Bijvoorbeeld Tomas">
    <label for="pgroup">Groepscode</label>
    <div class="row2"><input id="pgroup" maxlength="20" autocomplete="off" autocapitalize="characters" placeholder="ABC123"><button class="btn" type="button" id="newCode">Nieuwe code</button></div>
    <p class="err" id="setupErr"></p>
    <div class="btns">
      <button class="btn" type="button" id="setupCancel">Annuleren</button>
      <button class="btn on" type="submit">Opslaan</button>
    </div>
  </form>
</dialog>

<dialog id="scoreDlg">
  <form id="scoreForm" novalidate>
    <h2>Score toevoegen</h2>
    <label for="sgame">Spel</label>
    <select id="sgame"></select>
    <label for="stext">Gedeelde uitslag</label>
    <textarea id="stext" rows="4" placeholder="Tik in het spel op Delen en plak de uitslag hier"></textarea>
    <button class="btn" type="button" id="paste">Plakken</button>
    <label for="sval">Score</label>
    <input id="sval" inputmode="decimal" autocomplete="off" placeholder="Wordt herkend uit de uitslag">
    <p class="err" id="scoreErr"></p>
    <div class="btns">
      <button class="btn" type="button" id="scoreCancel">Annuleren</button>
      <button class="btn on" type="submit" id="scoreSave">Opslaan</button>
    </div>
  </form>
</dialog>

<dialog id="dlg">
  <form id="form" novalidate>
    <h2>Spel toevoegen</h2>
    <label for="fname">Naam</label>
    <input id="fname" autocomplete="off" placeholder="Bijvoorbeeld Slither">
    <label for="furl">Webadres</label>
    <input id="furl" inputmode="url" autocomplete="off" placeholder="spel.io">
    <p class="err" id="err"></p>
    <div class="btns">
      <button class="btn" type="button" id="cancel">Annuleren</button>
      <button class="btn on" type="submit">Toevoegen</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
